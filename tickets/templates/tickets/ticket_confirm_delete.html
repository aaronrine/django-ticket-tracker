{% extends "base.html" %}

{% block title %}Delete Ticket{% endblock %}

{% block content %}
<h2>Delete Ticket</h2>

<p>Are you sure you want to delete "{{ ticket.title }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
</form>

<p>
    <a href="{% url 'ticket-list' %}">Cancel</a>
</p>
{% endblock %}
