{% extends "base.html" %}

{% block title %}Delete Ticket{% endblock %}

{% block content %}
<h2>Delete Ticket</h2>

<p>Are you sure you want to delete "{{ ticket.title }}"?</p>

<form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next_url }}">
    <button class="danger-button" type="submit">Yes, delete</button>
</form>

<p>
    <a href="{{ next_url }}">Cancel</a>
</p>
{% endblock %}
