<!DOCTYPE html>
<html>

<head>
    <title>Delete Ticket</title>
</head>

<body>
    <h1>Delete Ticket</h1>

    <p>Are you sure you want to delete "{{ ticket.title }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
    </form>

    <p>
        <a href="{% url 'ticket-list' %}">Cancel</a>
    </p>
</body>

</html>
