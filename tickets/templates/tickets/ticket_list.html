<!DOCTYPE html>
<html>

<head>
    <title>Tickets</title>
</head>

<body>
    <h1>Tickets</h1>
    <p>
        <a href="{% url 'ticket-create' %}">New Ticket</a>
    </p>
    {% if tickets %}
    <ul>
        {% for ticket in tickets %}
        <li>
            <strong>{{ ticket.title }}</strong>
            — {{ ticket.status }}
            <a href="{% url 'ticket-edit' ticket.pk %}">Edit</a>
            <a href="{% url 'ticket-delete' ticket.pk %}">Delete</a>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No tickets yet.</p>
    {% endif %}
</body>

</html>
