{% extends "base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<h2>{{ page_title }}</h2>

<form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next_url }}"
    {{ form.as_p }}

    <button type="submit">{{ button_text }}</button>
</form>

<p>
    <a href="{{ next_url }}">Back to tickets</a>
</p>
{% endblock %}
